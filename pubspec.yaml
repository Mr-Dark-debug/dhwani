name: dhwani
description: "Real radio from your city and the world."
publish_to: none
version: 1.4.2+8

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  ffmpeg_kit_flutter_new_full: ^2.5.2
  file_selector: ^1.1.0
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: 3.3.2
  flutter_timezone: ^5.1.0
  go_router: ^17.5.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1
  rxdart: ^0.28.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  google_nav_bar: ^5.0.7
  flutter_native_splash: 2.4.7

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: 2.34.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/reference/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/dhwani_logo_1024.png
  adaptive_icon_background: "#F7F7F4"
  adaptive_icon_foreground: assets/branding/dhwani_logo_foreground.png
  adaptive_icon_monochrome: assets/branding/dhwani_logo_monochrome.png
  min_sdk_android: 24
  windows:
    generate: true
    image_path: assets/branding/dhwani_logo_1024.png

flutter_native_splash:
  color: "#F7F7F4"
  color_dark: "#11110F"
  image: assets/branding/dhwani_logo.png
  image_dark: assets/branding/dhwani_logo.png
  branding: assets/branding/dhwani_wordmark.png
  branding_dark: assets/branding/dhwani_wordmark.png
  android_12:
    color: "#F7F7F4"
    color_dark: "#11110F"
    image: assets/branding/dhwani_logo.png
    image_dark: assets/branding/dhwani_logo.png
